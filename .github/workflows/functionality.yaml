on: ["push", "pull_request"]

name: functionality

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: pr-ci-functionality.yaml-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:

  functionality:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        job: [plugintest, pmtest]

    steps:
    - uses: actions/checkout@v4

    - name: Cache Solidity Installations
      uses: actions/cache@v4
      with:
        path: |
          ~/.solcx
          ~/.vvm
        key: ${{ runner.os }}-compiler-cache

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Ganache
      run: npm install -g ganache-cli@6.12.2

    - name: Setup Python 3.8
      uses: actions/setup-python@v5
      with:
        python-version: 3.8

    - name: Install Tox
      run: pip install tox

    - name: Run Tox
      run: tox -e ${{ matrix.job }}

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
