on: ["push", "pull_request"]

name: linting

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: pr-ci-lint.yaml-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:

  linting:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        job: [lint, docs-local]
        experimental: [false]
        include:
          - job: docs-external
            experimental: true

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python 3.8
      uses: actions/setup-python@v5
      with:
        python-version: 3.8

    - name: Install Tox
      run: pip install tox

    - name: Run Tox
      run: tox -e ${{ matrix.job }}
      continue-on-error: ${{ matrix.experimental }}
